version: 2.1

# Dedicated opt-in only; no signing or publication.
parameters:
  release:
    type: boolean
    default: false

jobs:
  apple-release-1915-homebrew:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: stable
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_APPLE_SOURCE_REVISION: "0d2571a741883add178b485e8a1ad4d0222d4204"
    steps:
      - run:
          name: Checkout the exact verifier revision over public HTTPS
          command: |
            set -euo pipefail
            git init .
            git remote add origin https://github.com/leartshbj1/zentra.git
            git fetch --depth 1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Prepare the exact Apple application source and verified Homebrew prerequisites
          command: bash .circleci/apple1915-controller.sh prepare
          no_output_timeout: 20m
      - run:
          name: Verify the exact session-change refusal on the frozen application
          command: bash .circleci/apple1915-controller.sh native-preflight
          no_output_timeout: 20m
      - run:
          name: Verify native synchronization and mobile gestures
          command: bash .circleci/apple1915-controller.sh test
          no_output_timeout: 20m
      - run:
          name: Build the exact universal Mac application
          command: bash .circleci/apple1915-controller.sh macos
          no_output_timeout: 20m
      - run:
          name: Build the exact unsigned iPhone IPA and verify touch controls
          command: bash .circleci/apple1915-controller.sh iphone
          no_output_timeout: 20m
      - run:
          name: Launch the newly packaged Mac app in an isolated profile
          command: bash .circleci/apple1915-controller.sh smoke
          no_output_timeout: 5m
      - run:
          name: Record the distinct application and verifier revisions
          command: bash .circleci/apple1915-controller.sh record
      - store_artifacts:
          path: .zentra-apple-source/desktop/artifacts
          destination: apple

workflows:
  user-clarity-apple-homebrew-1915:
    when:
      and:
        - equal: [codex/release-1.90.15-apple-20261006, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple-release-1915-homebrew
