version: 2.1

# Opt-in only: ordinary pushes never consume the free release quota.
# The exact 1.86 release branch is also an explicit, one-release opt-in.
# Signing and publication remain local after artifact verification.
parameters:
  windows-autopilot-product-on:
    type: boolean
    default: false
  verify-only:
    type: boolean
    default: false
  verify-native-profile-only:
    type: boolean
    default: false
  verify-live-profile-only:
    type: boolean
    default: false
  verify-live-account-only:
    type: boolean
    default: false
  diagnostics-native-set:
    type: enum
    enum: [full, native-mail-payroll, benchmark-payment, benchmark-public-payment, action-engine]
    default: full
  release:
    type: boolean
    default: false
  platform:
    type: enum
    enum: [all, windows, apple, android]
    default: all
  smoke-windows-job:
    type: integer
    default: 0
  smoke-apple-job:
    type: integer
    default: 0
  smoke-windows-source:
    type: string
    default: ""
  smoke-apple-source:
    type: string
    default: ""

jobs:
  windows-autopilot-product:
    parameters:
      package:
        type: boolean
        default: false
    parallelism: 1
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_RELEASE_TEST_HARNESS: "true"
      ZENTRA_VERIFY_ONLY: "false"
    steps:
      - checkout
      - when:
          condition: << parameters.package >>
          steps:
            - run:
                name: Test and package the explicitly enabled Windows product
                command: ./desktop/scripts/cloud-release-windows.ps1 -WindowsAutopilotProductOn
                no_output_timeout: 40m
      - unless:
          condition: << parameters.package >>
          steps:
            - run:
                name: Compile OFF and ON without a private profile, credentials or package
                command: ./desktop/scripts/cloud-release-windows.ps1 -AutopilotBuildVerificationOnly
                no_output_timeout: 40m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows-autopilot-product
  windows-action-live-account-tests:
    parallelism: 1
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_VERIFY_DIAGNOSTICS_ONLY: "true"
      ZENTRA_VERIFY_ONLY: << pipeline.parameters.verify-only >>
      ZENTRA_VERIFY_NATIVE_PROFILE_ONLY: << pipeline.parameters.verify-native-profile-only >>
      ZENTRA_VERIFY_LIVE_PROFILE_ONLY: << pipeline.parameters.verify-live-profile-only >>
      ZENTRA_VERIFY_LIVE_ACCOUNT_ONLY: << pipeline.parameters.verify-live-account-only >>
      ZENTRA_LIVE_PROFILE_RELEASE: << pipeline.parameters.release >>
      ZENTRA_DIAGNOSTICS_NATIVE_SET: << pipeline.parameters.diagnostics-native-set >>
      ZENTRA_LIVE_PROFILE_PIPELINE_ID: << pipeline.id >>
    steps:
      - checkout
      - run:
          name: Compile a fresh A41 profile and connect then reopen two real native stores
          command: node desktop/scripts/verify-action-live-g4-ci-windows.mjs --ci-run
          no_output_timeout: 40m
      - store_artifacts:
          path: desktop/artifacts/action-live-profile
          destination: action-live-account-profile-compilation
      - store_artifacts:
          path: desktop/artifacts/action-live-account
          destination: action-live-account-public-report
  windows-action-live-profile-tests:
    parallelism: 1
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_VERIFY_DIAGNOSTICS_ONLY: "true"
      ZENTRA_VERIFY_ONLY: << pipeline.parameters.verify-only >>
      ZENTRA_VERIFY_NATIVE_PROFILE_ONLY: << pipeline.parameters.verify-native-profile-only >>
      ZENTRA_VERIFY_LIVE_PROFILE_ONLY: << pipeline.parameters.verify-live-profile-only >>
      ZENTRA_LIVE_PROFILE_RELEASE: << pipeline.parameters.release >>
      ZENTRA_DIAGNOSTICS_NATIVE_SET: << pipeline.parameters.diagnostics-native-set >>
      ZENTRA_LIVE_PROFILE_PIPELINE_ID: << pipeline.id >>
    steps:
      - checkout
      - run:
          name: Compile the exact public live sandbox profile and verify targeted library tests
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/scripts/verify-action-live-profile-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/action-live-profile
          destination: action-live-profile-validation
  windows-action-native-profile-tests:
    parallelism: 3
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_VERIFY_DIAGNOSTICS_ONLY: "true"
      ZENTRA_VERIFY_ONLY: "true"
      ZENTRA_VERIFY_NATIVE_PROFILE_ONLY: << pipeline.parameters.verify-native-profile-only >>
      ZENTRA_NATIVE_PROFILE_RELEASE: << pipeline.parameters.release >>
      ZENTRA_DIAGNOSTICS_NATIVE_SET: << pipeline.parameters.diagnostics-native-set >>
      ZENTRA_NATIVE_PROFILE_PIPELINE_ID: << pipeline.id >>
    steps:
      - checkout
      - run:
          name: Verify one compile-time native profile per isolated node
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/scripts/verify-action-native-profile-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/action-native-profile
          destination: action-native-profile-validation
  windows-drafts-diagnostics-tests:
    parameters:
