version: 2.1

# Dedicated opt-in only; no signing or publication.
parameters:
  release:
    type: boolean
    default: false

jobs:
  windows-release-1915-large:
    resource_class: windows.large
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_VERIFY_ONLY: "false"
      ZENTRA_RELEASE_TEST_HARNESS: "true"
      ZENTRA_WINDOWS_SOURCE_REVISION: "0d2571a741883add178b485e8a1ad4d0222d4204"
    steps:
      - checkout
      - run:
          name: Verify all frozen 1.90.15 Windows tests and build on Windows Large
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .circleci/windows1915-controller.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: .zentra-windows-source/desktop/artifacts/windows
          destination: windows

workflows:
  frozen-windows-release-1915-large:
    when:
      and:
        - equal: [codex/release-1.90.15-windows-large-20261006, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - windows-release-1915-large
