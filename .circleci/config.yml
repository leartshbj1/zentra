      - windows
      - apple
      - android
  brand-icon-1901:
    when:
      equal: [codex/brand-icon-1901, << pipeline.git.branch >>]
    jobs:
      - windows
      - apple
      - android
  bexio-import-190:
    when:
      equal: [codex/bexio-import-190, << pipeline.git.branch >>]
    jobs:
      - windows
  mail-connection-1891:
    when:
      equal: [codex/mail-connection-1891, << pipeline.git.branch >>]
    jobs:
      - windows
  fixed-assets-scan-validation:
    when:
      equal: [codex/fixed-assets-invoice-scan, << pipeline.git.branch >>]
    jobs:
      - windows
  release-189-windows:
    when:
      equal: [codex/release-1.89.0-windows, << pipeline.git.branch >>]
    jobs:
      - windows
  outgoing-mail-validation:
    when:
      equal: [codex/company-outgoing-mail, << pipeline.git.branch >>]
    jobs:
      - windows-mail-tests
  smoke-1881:
    when:
      equal: [codex/release-1.88.1-smoke, << pipeline.git.branch >>]
    jobs:
      - windows-package-smoke-1881
  release-1881:
    when:
      and:
        - equal: [codex/release-1.88.1, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - windows
      - apple
      - android
  release-188:
    when:
      and:
