version: 2.1

# Opt-in only: ordinary pushes never consume the free release quota.
# The exact 1.86 release branch is also an explicit, one-release opt-in.
# Signing and publication remain local after artifact verification.
parameters:
  verify-only:
    type: boolean
    default: false
  release:
    type: boolean
    default: false
  platform:
    type: enum
    enum: [all, windows, apple, android]
    default: all
  smoke-windows-job:
    type: integer
    default: 0
  smoke-apple-job:
    type: integer
    default: 0
  smoke-windows-source:
    type: string
    default: ""
  smoke-apple-source:
    type: string
    default: ""

jobs:
  windows-package-smoke-1907:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Verify the exact 1.90.7 installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows 168 958787be4e608b89a357f98c73d0c236bda677b4
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  android-optimized-payload-smoke:
    machine:
      image: android:default
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Launch the exact optimized ARM payload on a disposable emulator
          command: timeout 18m bash desktop/scripts/smoke-android-release-candidate.sh
          no_output_timeout: 5m
      - store_artifacts:
          path: desktop/artifacts/android-release-smoke
          destination: android-release-smoke
  iphone-brand-1906:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: stable
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - run:
          name: Checkout the iPhone packaging correction over HTTPS
          command: |
            set -euo pipefail
            git init .
            git remote add origin https://github.com/leartshbj1/zentra.git
            git fetch --depth 1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Verify icon installation and compiled PNG decoding
          command: python3 desktop/scripts/test_ios_icons.py
      - run:
          name: Prepare Apple build tools
          command: bash desktop/scripts/cloud-release-apple.sh prepare
      - run:
          name: Build iPhone package with the approved Zentra icons
          command: bash desktop/scripts/cloud-release-apple.sh iphone
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts
          destination: apple
  windows-updater-channel-tests:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_UPDATER_ONLY: "true"
    steps:
      - checkout
      - run:
          name: Verify repository-scoped update downloads and redirects
          no_output_timeout: 20m
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/scripts/cloud-release-windows.ps1
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  windows-backup-tests:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_BACKUP_ONLY: "true"
    steps:
      - checkout
      - run:
          name: Verify complete recovery with documents, branding and rollback
          no_output_timeout: 20m
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/scripts/cloud-release-windows.ps1
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  windows-package-smoke-1906:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Verify the exact 1.90.6 installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows 150 9ec8e782a160e7fe2cdf3b853e19e54bbfa64a01
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  windows-package-smoke-1905:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Verify the exact 1.90.5 installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows 147 3dfe7849b1ee6d4c1195f89927c7fc134e1cb72d
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  windows-package-smoke-1904:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Verify the exact 1.90.4 installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows 138 c07b1d4d3031659da6ba21388a70c464a6f83ec8
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  windows-pdf-pagination-tests:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_PDF_ONLY: "true"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - checkout
      - run:
          name: Verify native PDF section pagination and render synthetic examples
          command: ./desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  windows-project-report-tests:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_REPORTS_ONLY: "true"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - checkout
      - run:
          name: Verify reports and render four synthetic PDFs with the native renderer
          command: ./desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  windows-mail-tests:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_ONLY: "true"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - checkout
      - run:
          name: Verify company email, real PDF attachments and no duplicate SMTP submissions
          command: ./desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  windows-package-smoke-1881:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Verify the exact 1.88.1 installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows 104 4921d40e3dae221c3db90d7c353841440e687129
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  android:
    parameters:
      build-mode:
        type: enum
        enum: [debug, release]
        default: debug
    docker:
      - image: cimg/android:2026.08-node
    resource_class: large
    environment:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: stable
      ZENTRA_ANDROID_BUILD_MODE: << parameters.build-mode >>
    steps:
      - checkout
      - run:
          name: Prepare Android build tools without production credentials
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/zentra-rustup.sh
            sh /tmp/zentra-rustup.sh -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$HOME/.zentra-ci-tools/bin:$PATH"
            npm install --global --prefix "$HOME/.zentra-ci-tools" pnpm@11.19.0
            pnpm install --frozen-lockfile
      - run:
          name: Build physical Android package and verify alignment
          command: bash desktop/scripts/codemagic-android.sh
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/android-build
          destination: android
  windows-package-smoke:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      ZENTRA_SMOKE_JOB: << pipeline.parameters.smoke-windows-job >>
      ZENTRA_SMOKE_SOURCE: << pipeline.parameters.smoke-windows-source >>
    steps:
      - checkout
      - run:
          name: Verify the downloaded installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows $env:ZENTRA_SMOKE_JOB $env:ZENTRA_SMOKE_SOURCE
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  apple-package-smoke:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      ZENTRA_SMOKE_JOB: << pipeline.parameters.smoke-apple-job >>
      ZENTRA_SMOKE_SOURCE: << pipeline.parameters.smoke-apple-source >>
    steps:
      - checkout
      - run:
          name: Verify the downloaded universal app in a disposable Mac profile
          command: python3 desktop/scripts/cloud-package-smoke.py macos "$ZENTRA_SMOKE_JOB" "$ZENTRA_SMOKE_SOURCE"
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  windows:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_ONLY: << pipeline.parameters.verify-only >>
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - checkout
      - run:
          name: Test and build Windows without production credentials
          command: ./desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  apple:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: stable
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - run:
          name: Checkout the verified public source over HTTPS
          command: |
            set -euo pipefail
            source="$CIRCLE_SHA1"
            # Retry CI transport only; the release application source is unchanged.
            if [ "$CIRCLE_BRANCH" = 'codex/release-1.86.0-apple' ]; then
              source='bd22076fa970f76458a701c6cbfbbfceee94a8fb'
            fi
            git init .
            git remote add origin https://github.com/leartshbj1/zentra.git
            git fetch --depth 1 origin "$source"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$source"
      - run:
          name: Prepare Apple build tools
          command: bash desktop/scripts/cloud-release-apple.sh prepare
      - run:
          name: Verify native synchronization and mobile gestures
          command: bash desktop/scripts/cloud-release-apple.sh test
          no_output_timeout: 20m
      - run:
          name: Build universal Mac
          command: bash desktop/scripts/codemagic-apple.sh macos
          no_output_timeout: 20m
      - run:
          name: Build physical iPhone IPA and verify touch controls
          command: bash desktop/scripts/cloud-release-apple.sh iphone
          no_output_timeout: 20m
      - run:
          name: Launch the packaged Mac app in an isolated profile
          command: python3 desktop/scripts/local-apple-package-smoke.py
      - store_artifacts:
          path: desktop/artifacts
          destination: apple

workflows:
  first-client-package-1907:
    when:
      equal: [codex/release-1.90.7-windows-smoke, << pipeline.git.branch >>]
    jobs:
      - windows-package-smoke-1907
  first-client-1907:
    when:
      equal: [codex/first-client-release-1907, << pipeline.git.branch >>]
    jobs:
      - windows
      - apple
      - android:
          build-mode: release
  first-client-android-payload-smoke:
    when:
      equal: [codex/first-client-android-smoke-20260928, << pipeline.git.branch >>]
    jobs:
      - android-optimized-payload-smoke
  first-client-android-release:
    when:
      equal: [codex/first-client-android-release-20260927, << pipeline.git.branch >>]
    jobs:
      - android:
          build-mode: release
  iphone-brand-1906:
    when:
      equal: [codex/release-1.90.6-iphone-icons, << pipeline.git.branch >>]
    jobs:
      - iphone-brand-1906
  first-client-package-1906:
    when:
      equal: [codex/release-1.90.6-smoke, << pipeline.git.branch >>]
    jobs:
      - windows-package-smoke-1906
  first-client-1906:
    when:
      equal: [codex/first-client-release-1906, << pipeline.git.branch >>]
    jobs:
      - windows
      - apple
      - android
  first-client-package-1905:
    when:
      equal: [codex/release-1.90.5-smoke, << pipeline.git.branch >>]
    jobs:
      - windows-package-smoke-1905
  first-client-1905:
    when:
      equal: [codex/first-client-release-1905, << pipeline.git.branch >>]
    jobs:
      - windows
      - apple
      - android
  updater-channel-verification:
    when:
      equal: [codex/updater-channel-verification-20260927, << pipeline.git.branch >>]
    jobs:
      - windows-updater-channel-tests
  first-client-backup-verification:
    when:
      equal: [codex/backup-verification-20260927, << pipeline.git.branch >>]
    jobs:
      - windows-backup-tests
  first-client-shared-mail-verification:
    when:
      equal: [codex/shared-mail-verification-20260927, << pipeline.git.branch >>]
    jobs:
      - windows-mail-tests
  first-client-package-1904:
    when:
      equal: [codex/release-1.90.4-smoke, << pipeline.git.branch >>]
    jobs:
      - windows-package-smoke-1904
  first-client-1904:
    when:
      equal: [codex/first-client-release-1904, << pipeline.git.branch >>]
    jobs:
      - windows
      - apple
      - android
  first-client-pdf-pagination:
    when:
      equal: [codex/first-client-pdf-pagination-20260927, << pipeline.git.branch >>]
    jobs:
      - windows-pdf-pagination-tests
  first-client-project-reports:
    when:
      equal: [codex/first-client-project-reports-20260927, << pipeline.git.branch >>]
    jobs:
      - windows-project-report-tests
  first-client-apple-1903:
    when:
      equal: [codex/first-client-apple-1903, << pipeline.git.branch >>]
    jobs:
      - apple
  first-client-1903:
    when:
      equal: [codex/first-client-release-1903, << pipeline.git.branch >>]
    jobs:
      - windows
      - apple
      - android
  mail-logo-1902:
    when:
      equal: [codex/mail-logo-1902, << pipeline.git.branch >>]
