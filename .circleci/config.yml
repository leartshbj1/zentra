version: 2.1
parameters:
  release:
    type: boolean
    default: false
jobs:
  windows-package-smoke-1915:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      ZENTRA_SMOKE_JOB: "281"
      ZENTRA_SMOKE_SOURCE: "0d2571a741883add178b485e8a1ad4d0222d4204"
      ZENTRA_SMOKE_PIPELINE_SOURCE: "4a44c762a4c39c5f625519d1b52cef6391587249"
      ZENTRA_SMOKE_VERSION: "1.90.15"
    steps:
      - checkout
      - run:
          name: Verify the frozen application and exact successful Windows 281 package before NSIS smoke
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .circleci/windows-smoke1915-controller.ps1
          no_output_timeout: 5m
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
workflows:
  frozen-windows-package-smoke-1915:
    when:
      and:
        - equal: [codex/release-1.90.15-smoke-windows-20261006, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - windows-package-smoke-1915
