version: 2.1
parameters:
  release:
    type: boolean
    default: false
jobs:
  android-package-smoke-1915:
    machine:
      image: android:default
    resource_class: large
    environment:
      ZENTRA_SMOKE_JOB: "286"
      ZENTRA_SMOKE_SOURCE: "0d2571a741883add178b485e8a1ad4d0222d4204"
      ZENTRA_SMOKE_PIPELINE_SOURCE: "c5cd0c494b8d6b6110cd052fad3a75823d010196"
      ZENTRA_SMOKE_VERSION: "1.90.15"
      ZENTRA_ANDROID_SMOKE_JOB: "286"
      ZENTRA_ANDROID_SMOKE_SOURCE: "0d2571a741883add178b485e8a1ad4d0222d4204"
      ZENTRA_ANDROID_SMOKE_PIPELINE_SOURCE: "c5cd0c494b8d6b6110cd052fad3a75823d010196"
      ZENTRA_ANDROID_SMOKE_SHA256: "7cfc9225ee23b9eed11ec6dd92638134e7851ab024f3c904d087de0e0d498cec"
    steps:
      - checkout
      - run:
          name: Verify the frozen application and exact successful Android 286 APK before emulator smoke
          command: bash .circleci/android-smoke1915-controller.sh
          no_output_timeout: 5m
      - store_artifacts:
          path: desktop/artifacts/android-release-smoke
          destination: android-release-smoke
workflows:
  frozen-android-package-smoke-1915:
    when:
      and:
        - equal: [codex/release-1.90.15-smoke-android-20261006, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - android-package-smoke-1915
