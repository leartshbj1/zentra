version: 2.1

# Dedicated opt-in only; no signing or publication.
parameters:
  release:
    type: boolean
    default: false

jobs:
  android-release-1915-frozen:
    docker:
      - image: cimg/android:2026.08-node
    resource_class: large
    environment:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: stable
      ZENTRA_ANDROID_BUILD_MODE: release
      ZENTRA_ANDROID_SOURCE_REVISION: "0d2571a741883add178b485e8a1ad4d0222d4204"
    steps:
      - checkout
      - run:
          name: Prepare the exact frozen Android application without production credentials
          command: bash .circleci/android1915-controller.sh prepare
          no_output_timeout: 20m
      - run:
          name: Build the exact release APK and validate the new bytes
          command: bash .circleci/android1915-controller.sh build
          no_output_timeout: 20m
      - store_artifacts:
          path: .zentra-android-source/desktop/artifacts/android-build
          destination: android

workflows:
  frozen-android-release-1915:
    when:
      and:
        - equal: [codex/release-1.90.15-android-20261006, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - android-release-1915-frozen
