  windows-autopilot-release-large:
    resource_class: windows.large
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_VERIFY_ONLY: "false"
      ZENTRA_RELEASE_TEST_HARNESS: "true"
    steps:
      # Tauri and the palette generator rewrite tracked files with LF; an LF
      # checkout keeps them byte-identical so the post-package receipt stays clean.
      - run:
          name: Check out with repository line endings
          command: git config --global core.autocrlf false
      - checkout
      # Crate downloads only; every crate is still compiled in this job.
      - restore_cache:
          keys:
            - cargo-registry-windows-v1-{{ checksum "desktop/src-tauri/Cargo.lock" }}
      - run:
          name: Verify OFF and ON native release tests and package the Windows product with Autopilote
          command: ./desktop/scripts/cloud-release-windows.ps1 -WindowsAutopilotProductOn
          no_output_timeout: 40m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
      - save_cache:
          key: cargo-registry-windows-v1-{{ checksum "desktop/src-tauri/Cargo.lock" }}
          paths:
            - C:\Users\circleci\.cargo\registry\cache
            - C:\Users\circleci\.cargo\registry\index
  windows-release-1913:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZENTRA_VERIFY_ONLY: "false"
      ZENTRA_RELEASE_TEST_HARNESS: "true"
    steps:
      - checkout
      - run:
          name: Verify native release tests and build the exact Windows installer
          command: ./desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  apple:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: stable
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - run:
          name: Checkout the verified public source over HTTPS
          command: |
            set -euo pipefail
            source="$CIRCLE_SHA1"
            # Retry CI transport only; the release application source is unchanged.
            if [ "$CIRCLE_BRANCH" = 'codex/release-1.86.0-apple' ]; then
              source='bd22076fa970f76458a701c6cbfbbfceee94a8fb'
            fi
            git init .
            git remote add origin https://github.com/leartshbj1/zentra.git
            git fetch --depth 1 origin "$source"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$source"
      - run:
          name: Prepare Apple build tools
          command: bash desktop/scripts/cloud-release-apple.sh prepare
      - run:
          name: Verify the exact session-change refusal with the warm macOS protected cache
          command: |
            set -euo pipefail
            export PATH="$HOME/.zentra-ci-tools/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
            mkdir -p desktop/artifacts/validation
            cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib diagnostics::account_automation_diagnostics_tests::changed_session_or_company_during_transport_refuses_historical_response_without_logging_direct_strings -- --exact --test-threads=1 2>&1 | tee desktop/artifacts/validation/automation-session-change-macos.log
          no_output_timeout: 20m
      - run:
          name: Verify native synchronization and mobile gestures
          command: bash desktop/scripts/cloud-release-apple.sh test
          no_output_timeout: 20m
      - run:
          name: Build universal Mac
          command: bash desktop/scripts/codemagic-apple.sh macos
          no_output_timeout: 20m
      - run:
          name: Launch the packaged Mac app in an isolated profile
          command: python3 desktop/scripts/local-apple-package-smoke.py
      - run:
          name: Build physical iPhone IPA and verify touch controls
          command: bash desktop/scripts/cloud-release-apple.sh iphone
          no_output_timeout: 20m
      - run:
          name: Record the exact Apple pipeline revision
          command: |
            set -euo pipefail
            test -n "$CIRCLE_SHA1"
            printf '%s\n' "$CIRCLE_SHA1" > desktop/artifacts/VERIFIER-SOURCE.txt
      - store_artifacts:
          path: desktop/artifacts
          destination: apple

