version: 2.1

# Opt-in only: ordinary pushes never consume the free release quota.
# The exact 1.86 release branch is also an explicit, one-release opt-in.
# Signing and publication remain local after artifact verification.
parameters:
  verify-only:
    type: boolean
    default: false
  release:
    type: boolean
    default: false
  platform:
    type: enum
    enum: [all, windows, apple, android]
    default: all
  smoke-windows-job:
    type: integer
    default: 0
  smoke-apple-job:
    type: integer
    default: 0
  smoke-windows-source:
    type: string
    default: ""
  smoke-apple-source:
    type: string
    default: ""

jobs:
  windows-mail-tests:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_ONLY: "true"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - checkout
      - run:
          name: Verify company email, real PDF attachments and no duplicate SMTP submissions
          command: ./desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  windows-package-smoke-1881:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Verify the exact 1.88.1 installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows 104 4921d40e3dae221c3db90d7c353841440e687129
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  android:
    docker:
      - image: cimg/android:2026.08-node
    resource_class: large
    environment:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: stable
    steps:
      - checkout
      - run:
          name: Prepare Android build tools without production credentials
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/zentra-rustup.sh
            sh /tmp/zentra-rustup.sh -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$HOME/.zentra-ci-tools/bin:$PATH"
            npm install --global --prefix "$HOME/.zentra-ci-tools" pnpm@11.19.0
            pnpm install --frozen-lockfile
      - run:
          name: Build physical Android package and verify alignment
          command: bash desktop/scripts/codemagic-android.sh
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/android-build
          destination: android
  windows-package-smoke:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      ZENTRA_SMOKE_JOB: << pipeline.parameters.smoke-windows-job >>
      ZENTRA_SMOKE_SOURCE: << pipeline.parameters.smoke-windows-source >>
    steps:
      - checkout
      - run:
          name: Verify the downloaded installer in a disposable Windows profile
          command: python desktop/scripts/cloud-package-smoke.py windows $env:ZENTRA_SMOKE_JOB $env:ZENTRA_SMOKE_SOURCE
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  apple-package-smoke:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      ZENTRA_SMOKE_JOB: << pipeline.parameters.smoke-apple-job >>
      ZENTRA_SMOKE_SOURCE: << pipeline.parameters.smoke-apple-source >>
    steps:
      - checkout
      - run:
          name: Verify the downloaded universal app in a disposable Mac profile
          command: python3 desktop/scripts/cloud-package-smoke.py macos "$ZENTRA_SMOKE_JOB" "$ZENTRA_SMOKE_SOURCE"
      - store_artifacts:
          path: desktop/artifacts/smoke
          destination: smoke
  windows:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      ZENTRA_VERIFY_ONLY: << pipeline.parameters.verify-only >>
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - checkout
      - run:
          name: Test and build Windows without production credentials
          command: ./desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: windows
  apple:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: stable
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - run:
          name: Checkout the verified public source over HTTPS
          command: |
            set -euo pipefail
            source="$CIRCLE_SHA1"
            # Retry CI transport only; the release application source is unchanged.
            if [ "$CIRCLE_BRANCH" = 'codex/release-1.86.0-apple' ]; then
              source='bd22076fa970f76458a701c6cbfbbfceee94a8fb'
            fi
            git init .
            git remote add origin https://github.com/leartshbj1/zentra.git
            git fetch --depth 1 origin "$source"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$source"
      - run:
          name: Prepare Apple build tools
          command: bash desktop/scripts/cloud-release-apple.sh prepare
      - run:
          name: Verify native synchronization and mobile gestures
          command: bash desktop/scripts/cloud-release-apple.sh test
          no_output_timeout: 20m
      - run:
          name: Build universal Mac
          command: bash desktop/scripts/codemagic-apple.sh macos
          no_output_timeout: 20m
      - run:
          name: Build physical iPhone IPA and verify touch controls
          command: bash desktop/scripts/cloud-release-apple.sh iphone
          no_output_timeout: 20m
      - run:
          name: Launch the packaged Mac app in an isolated profile
          command: python3 desktop/scripts/local-apple-package-smoke.py
      - store_artifacts:
          path: desktop/artifacts
          destination: apple

workflows:
  fixed-assets-scan-validation:
    when:
      equal: [codex/fixed-assets-invoice-scan, << pipeline.git.branch >>]
    jobs:
      - windows-mail-tests
  release-189-windows:
    when:
      equal: [codex/release-1.89.0-windows, << pipeline.git.branch >>]
    jobs:
      - windows
  outgoing-mail-validation:
    when:
      equal: [codex/company-outgoing-mail, << pipeline.git.branch >>]
    jobs:
      - windows-mail-tests
  smoke-1881:
    when:
      equal: [codex/release-1.88.1-smoke, << pipeline.git.branch >>]
    jobs:
      - windows-package-smoke-1881
  release-1881:
    when:
      and:
        - equal: [codex/release-1.88.1, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - windows
      - apple
      - android
  release-188:
    when:
      and:
        - equal: [codex/release-1.88.0, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - windows
      - apple
      - android
  mobile-release-187:
    when:
      and:
        - equal: [codex/release-1.87.0, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple
      - android
  mobile-release-1861:
    when:
      and:
        - equal: [codex/release-1.86.1, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple
      - android
  apple-retry-186:
    when:
      and:
        - equal: [codex/release-1.86.0-apple, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple
  mobile-release-186:
    when:
      and:
        - equal: [codex/release-1.86.0, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple
      - android
  android-release-candidate:
    when:
      and:
        - << pipeline.parameters.release >>
        - or:
            - equal: [all, << pipeline.parameters.platform >>]
            - equal: [android, << pipeline.parameters.platform >>]
    jobs:
      - android
  verify-windows-package:
    when:
      not:
        equal: [0, << pipeline.parameters.smoke-windows-job >>]
    jobs:
      - windows-package-smoke
  verify-apple-package:
    when:
      not:
        equal: [0, << pipeline.parameters.smoke-apple-job >>]
    jobs:
      - apple-package-smoke
  windows-release-candidate:
    when:
      and:
        - << pipeline.parameters.release >>
        - or:
            - equal: [all, << pipeline.parameters.platform >>]
            - equal: [windows, << pipeline.parameters.platform >>]
    jobs:
      - windows
  apple-release-candidate:
    when:
      and:
        - << pipeline.parameters.release >>
        - or:
            - equal: [all, << pipeline.parameters.platform >>]
            - equal: [apple, << pipeline.parameters.platform >>]
    jobs:
      - apple
