version: 2.1
parameters:
  a72-build-private-source:
    type: boolean
    default: false
  a72-expected-config-sha:
    type: string
    default: ""
jobs:
  a72-private-source-web-build:
    docker:
      - image: cimg/node:22.19.0
    resource_class: medium
    parallelism: 1
    working_directory: /tmp
    environment:
      A72_EXPECTED_CONFIG_SHA: << pipeline.parameters.a72-expected-config-sha >>
      A72_EXPECTED_BRANCH: "codex/a72-private-web-build-20261015"
    steps:
      - run:
          name: Prepare public A72 coordinator
          shell: /bin/bash -eo pipefail
          command: |
            env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 node --input-type=module \<<'A72_NODE'
            import {gunzipSync} from 'node:zlib';
            import {createHash} from 'node:crypto';
            import {mkdirSync,writeFileSync,existsSync} from 'node:fs';
            const sha=b=>createHash('sha256').update(b).digest('hex');
            const zipped=Buffer.from('','base64');
            if(sha(zipped)!=='adb1e5f807183580f98e88a4451f39086f4b760e54b5489662458ddc61ff4a98')throw Error('A72_PUBLIC_PAYLOAD_REFUSED');
            const entries=JSON.parse(gunzipSync(zipped,{maxOutputLength:262144}));
            const expected=['protocol.mjs','ci-build.mjs','offer.json'];
            if(entries.length!==3||existsSync('/tmp/a72-public'))throw Error('A72_PUBLIC_PAYLOAD_REFUSED');
            mkdirSync('/tmp/a72-public',{mode:448});
            for(let i=0;i<3;i++){const [name,size,digest,text]=entries[i];const data=Buffer.from(text,'base64');if(name!==expected[i]||data.length!==size||sha(data)!==digest)throw Error('A72_PUBLIC_PAYLOAD_REFUSED');writeFileSync('/tmp/a72-public/'+name,data,{flag:'wx',mode:384});}
            A72_NODE
      - run:
          name: A72 ephemeral build daemon
          background: true
          no_output_timeout: 31m
          command: env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 CI=true CIRCLE_SHA1="$CIRCLE_SHA1" CIRCLE_BRANCH="$CIRCLE_BRANCH" CIRCLE_WORKFLOW_ID="$CIRCLE_WORKFLOW_ID" CIRCLE_BUILD_NUM="$CIRCLE_BUILD_NUM" CIRCLE_PROJECT_USERNAME="$CIRCLE_PROJECT_USERNAME" CIRCLE_PROJECT_REPONAME="$CIRCLE_PROJECT_REPONAME" CIRCLE_JOB="$CIRCLE_JOB" CIRCLE_NODE_INDEX="$CIRCLE_NODE_INDEX" CIRCLE_NODE_TOTAL="$CIRCLE_NODE_TOTAL" CIRCLE_SSH_ENABLED="$CIRCLE_SSH_ENABLED" A72_EXPECTED_CONFIG_SHA="$A72_EXPECTED_CONFIG_SHA" A72_EXPECTED_BRANCH="$A72_EXPECTED_BRANCH" node /tmp/a72-public/ci-build.mjs daemon
      - run:
          name: Wait for public A72 challenge
          command: env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 node /tmp/a72-public/ci-build.mjs wait-challenge
      - store_artifacts:
          path: /tmp/a72-public-output/challenge.public.json
          destination: a72-private-web-build/challenge.public.json
      - run:
          name: Wait for bounded encrypted A72 result
          no_output_timeout: 31m
          command: env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 node /tmp/a72-public/ci-build.mjs wait-result
      - store_artifacts:
          path: /tmp/a72-public-output/build.public.json
          destination: a72-private-web-build/build.public.json
      - store_artifacts:
          path: /tmp/a72-public-output/build.encrypted.json
          destination: a72-private-web-build/build.encrypted.json
workflows:
  a72-private-source-build-only:
    when: << pipeline.parameters.a72-build-private-source >>
    jobs:
      - a72-private-source-web-build:
          filters:
            branches:
              only: "codex/a72-private-web-build-20261015"
