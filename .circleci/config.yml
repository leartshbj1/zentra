      ZENTRA_VERIFY_ONLY: "true"
      ZENTRA_DIAGNOSTICS_NATIVE_SET: << pipeline.parameters.diagnostics-native-set >>
      ZENTRA_DIAGNOSTICS_PHASE: << parameters.diagnostics-phase >>
    steps:
      - checkout
      - run:
          name: Verify workspace workers, transfers, scoped drafts and account isolation without packaging
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/scripts/cloud-release-windows.ps1
          no_output_timeout: 20m
      - store_artifacts:
          path: desktop/artifacts/windows
          destination: diagnostics-validation
  windows-package-volume-1909:
    resource_class: windows.medium
