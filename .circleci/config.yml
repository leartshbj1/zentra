  android:
    parameters:
      build-mode:
        type: enum
        enum: [debug, release]
        default: debug
    docker:
      - image: cimg/android:2026.08-node
    resource_class: large
    environment:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: stable
      ZENTRA_ANDROID_BUILD_MODE: << parameters.build-mode >>
    steps:
      - checkout
      - run:
          name: Prepare Android build tools without production credentials
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/zentra-rustup.sh
            sh /tmp/zentra-rustup.sh -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$HOME/.zentra-ci-tools/bin:$PATH"
            npm install --global --prefix "$HOME/.zentra-ci-tools" pnpm@11.19.0
            pnpm install --frozen-lockfile
      - run:
          name: Build physical Android package and verify alignment
          command: bash desktop/scripts/codemagic-android.sh
