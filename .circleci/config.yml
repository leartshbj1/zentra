version: 2.1
parameters:
  run_a71_custom_metadata:
    type: boolean
    default: false
  a71_metadata_expected_sha:
    type: string
    default: ''
  a71_metadata_expected_branch:
    type: string
    default: ''
jobs:
  action-engine-custom-metadata-linux:
    docker:
      - image: cimg/node:22.19.0
    working_directory: ~/a71-public-metadata
    resource_class: small
    environment:
      A71_EXPECTED_SHA: << pipeline.parameters.a71_metadata_expected_sha >>
      A71_EXPECTED_BRANCH: << pipeline.parameters.a71_metadata_expected_branch >>
    steps:
      - run:
          name: Official CUSTOM metadata only, no checkout or secret context
          no_output_timeout: 8m
          command: |
            env -i PATH="$PATH" CI=true CIRCLE_JOB="$CIRCLE_JOB" CIRCLE_PROJECT_USERNAME="$CIRCLE_PROJECT_USERNAME" CIRCLE_PROJECT_REPONAME="$CIRCLE_PROJECT_REPONAME" CIRCLE_SHA1="$CIRCLE_SHA1" CIRCLE_BRANCH="$CIRCLE_BRANCH" CIRCLE_BUILD_NUM="$CIRCLE_BUILD_NUM" CIRCLE_WORKFLOW_ID="$CIRCLE_WORKFLOW_ID" A71_EXPECTED_SHA="$A71_EXPECTED_SHA" A71_EXPECTED_BRANCH="$A71_EXPECTED_BRANCH" node --input-type=module <<'A71_NODE'
            import { writeFileSync } from 'node:fs';
            const payload = JSON.parse(Buffer.from('', 'base64').toString('utf8'));
            try {
              for (const name of ['custom-contract.mjs', 'run-ci.mjs', 'fixture.public.json']) {
                writeFileSync(name, Buffer.from(payload[name], 'base64'), { flag: 'wx' });
              }
              const { runCi } = await import('./run-ci.mjs');
              runCi();
            } catch { console.error('ZENTRA_A71_CUSTOM_CI_REFUSED'); process.exitCode = 1; }
            A71_NODE
      - store_artifacts:
          path: artifacts
          destination: action-engine-custom-metadata
workflows:
  a71-official-custom-metadata:
    when: << pipeline.parameters.run_a71_custom_metadata >>
    jobs:
      - action-engine-custom-metadata-linux
