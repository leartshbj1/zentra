      - android
  mobile-release-1861:
    when:
      and:
        - equal: [codex/release-1.86.1, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple
      - android
  apple-retry-186:
    when:
      and:
        - equal: [codex/release-1.86.0-apple, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple
  mobile-release-186:
    when:
      and:
        - equal: [codex/release-1.86.0, << pipeline.git.branch >>]
        - not: << pipeline.parameters.release >>
    jobs:
      - apple
      - android
  android-release-candidate:
    when:
      and:
        - << pipeline.parameters.release >>
        - or:
            - equal: [all, << pipeline.parameters.platform >>]
            - equal: [android, << pipeline.parameters.platform >>]
    jobs:
      - android
  verify-windows-package:
    when:
      not:
        equal: [0, << pipeline.parameters.smoke-windows-job >>]
    jobs:
      - windows-package-smoke
  verify-apple-package:
    when:
      not:
        equal: [0, << pipeline.parameters.smoke-apple-job >>]
    jobs:
      - apple-package-smoke
  windows-release-candidate:
    when:
      and:
        - << pipeline.parameters.release >>
        - or:
            - equal: [all, << pipeline.parameters.platform >>]
            - equal: [windows, << pipeline.parameters.platform >>]
    jobs:
      - windows
  apple-release-candidate:
