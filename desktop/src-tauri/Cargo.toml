[package]
name = "helvichantier"
version = "1.35.0"
description = "Zentra - gestion d’entreprise locale et multisectorielle pour Windows et macOS"
authors = ["Zentra"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "helvichantier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Zentra"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
ed25519-dalek = "2"
encoding_rs = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = "0.38"
minisign-verify = "0.2"
pdf-extract = "0.10"
quick-xml = "0.41"
qrcode = { version = "0.14", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3.7"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-zentra-mobile = { path = "../plugins/zentra-mobile" }
tauri-plugin-fs = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
