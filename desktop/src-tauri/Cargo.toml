[package]
name = "helvichantier"
version = "1.3.0"
description = "Elyko - gestion d’entreprise locale et multisectorielle pour Windows"
authors = ["Elyko"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "helvichantier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Elyko"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
ed25519-dalek = "2"
encoding_rs = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = "0.38"
minisign-verify = "0.2"
pdf-extract = "0.10"
quick-xml = "0.41"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tempfile = "3"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
