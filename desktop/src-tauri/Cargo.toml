[package]
name = "helvichantier"
version = "1.1.0"
description = "Elyko - gestion d’entreprise locale et multisectorielle pour Windows"
authors = ["Elyko"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "helvichantier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Elyko"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
