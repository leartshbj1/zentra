<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zentra · nouvelle interface mobile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 12px; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #e9ebed; color: #242925; }
    header { max-width: 390px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
    header strong { flex: 1; font-size: 16px; }
    header p { width: 100%; margin: 0; color: #626a65; font-size: 12px; }
    button { padding: 8px 12px; min-height: 40px; border: 1px solid #c5cac7; border-radius: 12px; font: inherit; color: inherit; background: #fff; cursor: pointer; }
    iframe { display: block; width: min(390px, 100%); height: 844px; max-height: calc(100dvh - 108px); min-height: 480px; margin: auto; border: 1px solid #d2d6d3; border-radius: 26px; background: #f5f5f7; box-shadow: 0 18px 60px #17271e14; }
    @media (prefers-color-scheme: dark) { body { background: #242527; color: #f5f5f7; } header p { color: #bfc4c0; } }
  </style>
</head>
<body>
  <header><strong>Zentra · mobile</strong><button id="theme" type="button">Mode sombre</button><p>Aperçu interactif · données d’exemple · aucune entreprise réelle</p></header>
  <iframe id="app" title="Aperçu de Zentra sur mobile"></iframe>
  <script type="module">
    localStorage.setItem('elyko-guided-tour-v3', 'completed');
    localStorage.setItem('zentra.appearance.v1', 'light');
    localStorage.setItem('zentra.interface.language.v1', 'fr');
    document.querySelector('#app').src = './mobile-harness.html?browsing=1&design=1&payroll=1';
    let dark = false;
    document.querySelector('#theme').addEventListener('click', () => {
      dark = !dark;
      localStorage.setItem('zentra.appearance.v1', dark ? 'dark' : 'light');
      document.querySelector('#theme').textContent = dark ? 'Mode clair' : 'Mode sombre';
    });
  </script>
</body>
</html>
