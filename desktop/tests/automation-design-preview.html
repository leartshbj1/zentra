<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zentra — Nouvel espace Automation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaeaed;color:#27272b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 22px;background:#fff;border-bottom:1px solid #dddde2}header div{display:grid;gap:3px;margin-right:auto}strong{font-weight:600}small{color:#686871}label{display:flex;align-items:center;gap:8px;font-size:12px}select{min-height:36px;border:1px solid #dcdce1;border-radius:8px;padding:6px 10px;background:white;color:inherit;font:inherit}main{padding:18px;display:grid;justify-items:center}iframe{display:block;border:0;width:100%;height:calc(100dvh - 118px);min-height:620px;border-radius:12px;background:#f6f6f8;box-shadow:0 8px 28px #16161d12;max-width:100%}body[data-device=phone] iframe{width:390px;height:844px;border-radius:24px}body[data-device=narrow] iframe{width:320px;height:780px;border-radius:24px}@media(max-width:600px){header{padding:12px;gap:10px}header div{width:100%}main{padding:10px}iframe{min-height:650px}}
</style></head>
<body data-device="desktop"><header><div><strong>Le nouvel espace Automation</strong><small>Aperçu interactif · données fictives, aucun envoi réel</small></div><label>Écran<select id="device"><option value="desktop">Ordinateur</option><option value="phone">iPhone · 390 px</option><option value="narrow">Petit écran · 320 px</option></select></label><label>Apparence<select id="theme"><option value="light">Claire</option><option value="dark">Sombre</option></select></label><label>Langue<select id="language"><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="en">English</option></select></label></header><main><iframe title="Application Zentra — démonstration" src="/tests/mobile-harness.html?browsing=1&design=1&automation=1&automationDesign=1&theme=light&language=fr"></iframe></main>
<script>
const device=document.getElementById('device'),theme=document.getElementById('theme'),language=document.getElementById('language'),frame=document.querySelector('iframe');device.addEventListener('change',()=>document.body.dataset.device=device.value);for(const field of[theme,language])field.addEventListener('change',()=>{frame.src='/tests/mobile-harness.html?browsing=1&design=1&automation=1&automationDesign=1&theme='+theme.value+'&language='+language.value});
</script></body></html>
