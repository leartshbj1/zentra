name: Zentra Support - Synchronisation mail
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: support-mail-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer et classer les nouveaux mails
        env:
          SUPPORT_MAIL_SYNC_TOKEN: ${{ secrets.SUPPORT_MAIL_SYNC_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token = process.env.SUPPORT_MAIL_SYNC_TOKEN;
          if (!token) throw new Error('La synchronisation mail doit être configurée.');
          const started = Date.now();
          const budgetMs = 12 * 60 * 1000;
          const count = value => {
            if (value === undefined) return 0;
            if (!Number.isSafeInteger(value) || value < 0) throw new Error('Compteur du traitement automatique invalide.');
            return value;
          };
          let imported = 0, processed = 0, failed = 0, workflowsChecked = 0, workflowsFailed = 0, workflowsInterrupted = 0, batches = 0, drained = false;
          try {
          for (; batches < 60 && Date.now() - started < budgetMs;) {
            const response = await fetch('https://zentraapp.ch/api/support/mail-sync', {
              method: 'POST', redirect: 'error',
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(Math.max(1, Math.min(300000, budgetMs - (Date.now() - started)))),
            });
            if (!response.ok) throw new Error(`Synchronisation indisponible (${response.status}).`);
            const result = await response.json();
            if (!result || typeof result.idle !== 'boolean' || typeof result.failed !== 'boolean') {
              throw new Error('Réponse du traitement automatique invalide.');
            }
            batches++;
            imported += count(result.imported);
            processed += count(result.processed);
            failed += result.failed ? 1 : 0;
            workflowsChecked += count(result.workflows?.checked);
            workflowsFailed += count(result.workflows?.failed);
            workflowsInterrupted += count(result.workflows?.interrupted);
            if (result.idle) { drained = true; break; }
          }
          } finally {
            console.log(JSON.stringify({ imported, processed, failed, workflowsChecked, workflowsFailed, workflowsInterrupted, batches, drained }));
          }
          if (failed) throw new Error('Une boîte ou une action Automation nécessite une vérification dans Zentra.');
          if (!drained) throw new Error('Le traitement a atteint sa limite avant de terminer la file. Vérifiez le retard et la capacité du planificateur.');
          JS
