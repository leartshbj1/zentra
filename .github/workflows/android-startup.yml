name: Zentra Android startup check

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Existing mobile preview run containing an x86_64 APK
        required: true
        type: string
      compact_preview:
        description: Strip debug symbols and export compact test APKs with the pinned preview signature
        type: boolean
        default: false
      upgrade_from_run:
        description: Optional previous mobile preview build to re-sign as an isolated upgrade test fixture
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the existing native build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'Zentra-Android-preview-*' --dir /tmp/zentra-apk
      - name: Prepare compact debug previews
        if: inputs.compact_preview
        env:
          ZENTRA_ANDROID_PREVIEW_KEYSTORE: ${{ secrets.ZENTRA_ANDROID_PREVIEW_KEYSTORE }}
          ZENTRA_ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ZENTRA_ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;36.0.0"
          python3 desktop/scripts/compact-android-preview.py /tmp/zentra-apk desktop/artifacts/android
      - name: Prepare the previous version as an upgrade fixture
        if: inputs.upgrade_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.upgrade_from_run }}
          COMPACT_PREVIEW: ${{ inputs.compact_preview }}
          ZENTRA_ANDROID_PREVIEW_KEYSTORE: ${{ secrets.ZENTRA_ANDROID_PREVIEW_KEYSTORE }}
          ZENTRA_ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ZENTRA_ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          test "$COMPACT_PREVIEW" = true
          gh run download "$PREVIOUS_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'Zentra-Android-preview-*' --dir /tmp/zentra-previous
          python3 desktop/scripts/compact-android-preview.py /tmp/zentra-previous /tmp/zentra-upgrade-fixture
      - name: Configure emulator and verify startup
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/zentra-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n zentra-ci -k "system-images;android-35;google_apis;x86_64" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx zentra-ci
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd zentra-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > /tmp/zentra-emulator.log 2>&1 &
          apk="$(find /tmp/zentra-apk -name '*x86_64*.apk' -print -quit)"
          if [[ -f desktop/artifacts/android/app-x86_64-debug.apk ]]; then
            apk=desktop/artifacts/android/app-x86_64-debug.apk
          fi
          test -n "$apk"
          if [[ -f /tmp/zentra-upgrade-fixture/app-x86_64-debug.apk ]]; then
            bash desktop/scripts/smoke-android.sh /tmp/zentra-upgrade-fixture/app-x86_64-debug.apk
            bash desktop/scripts/smoke-android-upgrade.sh "$apk"
          else
            bash desktop/scripts/smoke-android.sh "$apk"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Android-startup-${{ github.run_id }}
          path: desktop/artifacts/android/*
          retention-days: 14
