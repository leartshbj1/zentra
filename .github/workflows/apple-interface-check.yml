name: Apple interface native compilation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appkit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash desktop/scripts/select-xcode-glass.sh
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir desktop build:web
        env:
          TAURI_ENV_PLATFORM: macos
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Check AppKit integration on Apple Silicon
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets --target aarch64-apple-darwin
      - name: Check AppKit integration on Intel
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets --target x86_64-apple-darwin
