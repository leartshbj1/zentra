workflows:
  iphone-personal:
    name: Zentra iPhone personnel (licence propriétaire)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      groups:
        - owner_iphone_163
      vars:
        RUSTUP_TOOLCHAIN: stable
    scripts:
      - name: Prepare the Apple toolchain
        script: bash desktop/scripts/codemagic-apple.sh prepare
      - name: Build the private iPhone IPA
        script: bash desktop/scripts/codemagic-apple.sh iphone-personal
      - name: Verify Liquid Glass touch targets
        script: bash desktop/scripts/test-apple-navigation.sh
    artifacts:
      - desktop/artifacts/iphone-personal/*
      - desktop/artifacts/navigation/*.log
  apple-appearance-tests:
    name: Apple appearance and Liquid Glass checks
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Verify native colours and touch targets
        script: bash desktop/scripts/test-apple-navigation.sh
    artifacts:
      - desktop/artifacts/navigation/*.log
  macos-public:
    name: Zentra macOS universal (free M2)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      vars:
        RUSTUP_TOOLCHAIN: stable
    scripts:
      - name: Prepare the Apple toolchain
        script: bash desktop/scripts/codemagic-apple.sh prepare
      - name: Verify mobile WebKit gestures
        script: bash desktop/scripts/test-mobile-webkit.sh
      - name: Build and verify macOS
        script: bash desktop/scripts/codemagic-apple.sh macos
    artifacts:
      - desktop/artifacts/macos/*
  iphone:
    name: Zentra iPhone IPA (free M2)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      vars:
        RUSTUP_TOOLCHAIN: stable
    scripts:
      - name: Prepare the Apple toolchain
        script: bash desktop/scripts/codemagic-apple.sh prepare
      - name: Build and verify iPhone IPA
        script: bash desktop/scripts/codemagic-apple.sh iphone
      - name: Verify Liquid Glass touch targets
        script: bash desktop/scripts/test-apple-navigation.sh
    artifacts:
      - desktop/artifacts/iphone/*
      - desktop/artifacts/navigation/*.log
