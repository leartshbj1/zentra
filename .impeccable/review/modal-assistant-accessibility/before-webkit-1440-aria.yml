- dialog "Nouvelle fiche de salaire":
  - banner:
    - heading "Nouvelle fiche de salaire" [level=2]
    - paragraph: Choisissez la personne, indiquez son salaire et vérifiez le net.
    - button "Demander à l’assistant Zentra"
    - button "Fermer « Nouvelle fiche de salaire »"
  - list "Étapes de création":
    - listitem: Collaborateur
    - listitem: 2 Salaire du mois
    - listitem: 3 Vérification
  - paragraph: Élodie Dubois · septembre 2026
  - heading "Qu’est-ce qui change ce mois-ci ?" [level=3]
  - paragraph: Le salaire habituel est prérempli. Ajoutez seulement les compléments nécessaires.
  - group:
    - text: Salaire brut du mois
    - spinbutton "Salaire brut du mois (CHF)": "5123.45"
    - text: CHF Montant avant retenues, pour le taux d’activité convenu.
    - group: Ajouter ou modifier un complément de salaire
    - group: Règles et montants de mon canton · 2026
    - region "La prochaine étape":
      - strong: 1 point à compléter
      - paragraph: Commençons par « Complétez le salaire annuel pour la pension ». Le guide ouvre le bon champ, puis vous ramène à cette fiche.
      - button "Compléter avec le guide"
    - group:
      - text: Mes cotisations et assurances
      - group: Vérifier les cotisations et leurs bases
  - complementary "Continuer plus tard":
    - strong: Vous pouvez continuer plus tard.
    - paragraph: Conservez le salaire saisi, même si les assurances ne sont pas encore prêtes. Le brouillon restera à calculer avant de pouvoir être payé.
    - button "Enregistrer le salaire en brouillon"
  - button "Retour"
  - button "Vérifier le salaire"
- dialog "Assistant Zentra":
  - banner:
    - heading "Assistant Zentra" [level=2]
    - paragraph: Votre aide locale, au fil de votre travail.
    - button "Fermer « Assistant Zentra »"
  - text: Création de fiche de salaire
  - group: Contexte utilisé
  - paragraph: Qwen fonctionne sur cet appareil. Il explique les étapes ; vous gardez la décision et la validation.
  - log "Conversation avec l’assistant":
    - text: Vous
    - paragraph: Comment vérifier le contrat de la caisse de pension avant de terminer cette fiche ?
    - text: Guide vérifié Zentra
    - paragraph: Ouvrez le plan LPP pour vérifier le contrat de votre caisse, puis revenez au salaire.
    - button "Copier la réponse"
  - status: La réponse de l’assistant est disponible.
  - group: Guide Zentra et raccourcis
  - text: Votre question
  - textbox "Votre question":
    - /placeholder: Posez votre question…
  - button "Envoyer la question" [disabled]
  - text: Pour les chiffres et les cotisations, vérifiez les calculs Zentra et vos documents.
  - button "Effacer la conversation"